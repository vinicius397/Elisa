<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Painel do site — Elisa Vasconcelos</title>
<link rel="icon" href="../assets/img/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="admin.css">
</head>
<body>

<!-- Tela de entrada (só aparece quando o site está numa hospedagem com PHP) -->
<div class="gate" id="gate" hidden>
  <form class="gate__card" id="gate-form">
    <p class="eyebrow"><i class="dot"></i>Painel do site</p>
    <h1 class="gate__title" id="gate-title">Entrar</h1>
    <p class="gate__text" id="gate-text">Digite a senha do painel.</p>
    <label class="f"><span>Senha</span><input type="password" id="gate-pass" autocomplete="current-password" required></label>
    <label class="f" id="gate-pass2-wrap" hidden><span>Repita a senha</span><input type="password" id="gate-pass2" autocomplete="new-password"></label>
    <p class="gate__err" id="gate-err" role="alert"></p>
    <button class="btn btn--primary" type="submit" id="gate-btn">Entrar</button>
  </form>
</div>

<div class="app" id="app" hidden>
  <header class="bar">
    <div class="bar__brand">
      <p class="eyebrow"><i class="dot"></i>Painel do site</p>
      <p class="bar__name" id="bar-name">Elisa <em>Vasconcelos</em></p>
    </div>
    <p class="bar__mode" id="mode-pill"></p>
    <div class="bar__actions">
      <button class="btn btn--ghost" type="button" id="btn-todo">Pendências <b id="todo-count">0</b></button>
      <a class="btn btn--ghost" href="../index.html" target="_blank" rel="noopener">Ver site ↗</a>
      <button class="btn btn--primary" type="button" id="btn-save" disabled>Salvar alterações</button>
    </div>
  </header>

  <div class="notice" id="notice" hidden></div>

  <div class="work">
    <nav class="side" id="side" aria-label="Seções"></nav>

    <main class="editor" id="editor" tabindex="-1"></main>

    <aside class="preview" id="preview">
      <div class="preview__bar">
        <p class="eyebrow">Prévia ao vivo</p>
        <div class="seg" role="group" aria-label="Tamanho da prévia">
          <button type="button" data-dev="desktop" class="is-on">Computador</button>
          <button type="button" data-dev="phone">Celular</button>
        </div>
      </div>
      <div class="preview__stage" id="preview-stage">
        <iframe id="preview-frame" title="Prévia do site"></iframe>
      </div>
    </aside>
  </div>

  <button class="fab" type="button" id="btn-preview-toggle">Ver prévia</button>
</div>

<!-- Pendências: textos entre [colchetes] -->
<div class="modal" id="todo" hidden role="dialog" aria-modal="true" aria-labelledby="todo-title">
  <div class="modal__card">
    <div class="modal__head"><h2 id="todo-title">Pendências</h2><button class="btn btn--ghost" type="button" data-close>Fechar</button></div>
    <p class="modal__text">Textos entre <b>[colchetes]</b> são marcadores que eu deixei onde faltam informações reais. Clique para ir até o campo.</p>
    <ol class="todo" id="todo-list"></ol>
  </div>
</div>

<!-- Escolher foto -->
<div class="modal" id="picker" hidden role="dialog" aria-modal="true" aria-labelledby="picker-title">
  <div class="modal__card modal__card--wide">
    <div class="modal__head"><h2 id="picker-title">Escolher foto</h2><button class="btn btn--ghost" type="button" data-close>Fechar</button></div>
    <label class="drop" id="picker-drop">
      <input type="file" accept="image/jpeg,image/png,image/webp" id="picker-file">
      <b>Enviar uma foto do computador ou celular</b>
      <span>JPG, PNG ou WebP. Fotos grandes são reduzidas automaticamente para carregar rápido.</span>
    </label>
    <p class="eyebrow picker__label">Ou use uma foto que já está no site</p>
    <div class="picker__grid" id="picker-grid"></div>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="../content/content.js"></script>
<script src="admin.js"></script>
</body>
</html>
